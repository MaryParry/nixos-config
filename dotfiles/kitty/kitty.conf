# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family='SF Mono' style=Regular
bold_font        family='SF Mono' style=Semibold
italic_font      family='SF Mono' style='Regular Italic'
bold_italic_font family='SF Mono' style='Semibold Italic'
# END_KITTY_FONTS

# Nerd Fonts v3.2.0 Symbol Map (mapping symbols to JetBrainsMono Nerd Font)
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e300-U+e3e3,U+e200-U+e2a9,U+e5fa-U+e6b1,U+e700-U+e7c5,U+f000-U+f2e0,U+e263-U+e263,U+e0a0-U+e0a2,U+e0b0-U+e0b3,U+e0a3-U+e0a3,U+e0b4-U+e0c8,U+e0ca-U+e0ca,U+e0cc-U+e0d4,U+23fb-U+23fe,U+2b58-U+2b58,U+f300-U+f372,U+e900-U+e999,U+f400-U+f532,U+2665-U+2665,U+26a1-U+26a1,U+e100-U+e170,U+f0001-U+f1af0 JetBrainsMono Nerd Font

cursor_shape block
cursor_blink_interval 0.5
window_padding_width 0
