window_padding_width 10 14
# background #171717
include ../themes/apple-dark.conf

# Translucent, blurred background (KWin does the blur)
background_opacity 0.8
# Lets config reloads and ctrl+shift+a then m/l change it in open windows
dynamic_background_opacity yes
background_blur 1

tab_bar_edge top
tab_bar_align center
tab_bar_style separator
tab_separator ""
tab_title_template " {title} "


