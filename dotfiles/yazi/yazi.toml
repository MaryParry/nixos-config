# Yazi Configuration - Cozy Gruvbox Workstation

[manager]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 1920
max_height      = 1080
image_filter    = "nearest"
image_quality   = 85
sixel_fraction  = 15

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open", for = "unix" },
]
play = [
    { run = 'mpv "$@"', orphan = true, for = "unix" },
]

[open]
rules = [
    { name = "*/", use = [ "edit", "open" ] },
    { mime = "text/*", use = [ "edit", "open" ] },
    { mime = "image/*", use = [ "open" ] },
    { mime = "{audio,video}/*", use = [ "play", "open" ] },
    { mime = "application/json", use = [ "edit", "open" ] },
    { mime = "*/javascript", use = [ "edit", "open" ] },
    { mime = "*", use = [ "open" ] },
]
