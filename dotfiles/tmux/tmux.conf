# Configuration for running tmux in Kitty terminal

# Set default terminal to support 256 colors
set -g default-terminal "tmux-256color"

# Enable TrueColor (RGB) support specifically for Kitty
set-as terminal-features ",xterm-kitty:RGB"

# Enable clipboard integration via OSC 52
set -s set-clipboard on

# Allow passthrough for Kitty graphics/image protocol (e.g., yazi image previews)
set -g allow-passthrough on

# Enable mouse support
set -g mouse on
