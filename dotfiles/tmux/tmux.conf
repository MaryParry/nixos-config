# ==============================================================================
#  TMUX CONFIGURATION - Noctalia / Sakura Theme
# ==============================================================================

# --- General Settings ---
# Terminal & TrueColor Support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -s escape-time 10
set -g history-limit 10000

# Mouse Support (click windows/panes, drag borders to resize, scroll history)
set -g mouse on

# 1-Based Indexing (matches keyboard layout: 1..9 instead of 0..8)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefix Configuration ---
# Dual Prefix: Ctrl+a (primary) and Ctrl+b (secondary)
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# --- Easy Keybindings ---
# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 󰑓 Tmux configuration reloaded! "

# Quick Cheat Sheet Popup (Prefix + ? or press F1 anywhere inside tmux)
bind '?' display-popup -E -w 75% -h 75% -b rounded -S "fg=#d8a657" -T " 󰋖 Tmux Quick Cheat Sheet " "less -R ~/.config/tmux/cheatsheet.txt"
bind -n F1 display-popup -E -w 75% -h 75% -b rounded -S "fg=#d8a657" -T " 󰋖 Tmux Quick Cheat Sheet " "less -R ~/.config/tmux/cheatsheet.txt"

# Split panes intuitively (inherits current working directory)
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '_' split-window -v -c "#{pane_current_path}"

# Open new window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation with Alt + Arrow keys (No prefix needed!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane navigation with Prefix + Vim keys (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation with Shift + Left/Right (No prefix needed!)
bind -n S-Left previous-window
bind -n S-Right next-window

# Jump directly to windows with Alt + 1..9 (No prefix needed!)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resizing panes easily (Prefix + Shift + Arrow keys)
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5

# --- Copy Mode (Vi Mode) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==============================================================================
#  THEME: Gruvbox Material / Blocky Style (Swaystation)
#  Yellow: #d8a657 | Blue: #83a598 | Dark: #1d1d1d / #222222
#  Grey Dark: #393939 / #484848 | Grey Light: #a89984 | Text: #fff4d2
# ==============================================================================

# Status Bar Base Settings
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=default,fg=#fff4d2"

# Pane Borders
set -g pane-border-style "fg=#484848,bg=default"
set -g pane-active-border-style "fg=#d8a657,bg=default"
set -g display-panes-color "#83a598"
set -g display-panes-active-color "#d8a657"

# Command Line & Popup Messages
set -g message-style "bg=#d8a657,fg=#1d1d1d,bold"
set -g message-command-style "bg=#1d1d1d,fg=#d8a657,bold"
set -g mode-style "bg=#d8a657,fg=#1d1d1d,bold"

# Left Status (Prefix indicator or clean)
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#ffffff,bg=#cc241d,bold] 󰌌 PREFIX #[bg=default] ,}"

# Right Status (Working Directory & Session Name Block)
set -g status-right-length 80
set -g status-right "#[fg=#fff4d2,bg=#393939,bold] 󰋜 #{b:pane_current_path} #[fg=#222222,bg=#83a598,bold] 󰃰 %H:%M #[fg=#000000,bg=#d8a657,bold] 󰍹 #S "

# Window List Styling
set -g window-status-separator " "

# Inactive Window Tab (Blocky grey style with circle indicator)
set -g window-status-format "#[fg=#fff4d2,bg=#484848,bold]  #I #[fg=#222222,bg=#a89984,bold] #W "

# Active Window Tab (Blocky yellow + blue style with dot indicator)
set -g window-status-current-format "#[fg=#000000,bg=#d8a657,bold]  #I #[fg=#000000,bg=#83a598,bold] #W#{?window_zoomed_flag, 󰁌 ,} "
