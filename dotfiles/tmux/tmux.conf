# ==============================================================================
#  TMUX CONFIGURATION - Noctalia / Sakura Theme
# ==============================================================================

# --- General Settings ---
# Terminal & TrueColor Support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -s escape-time 10
set -g history-limit 10000

# Mouse Support (click windows/panes, drag borders to resize, scroll history)
set -g mouse on

# 1-Based Indexing (matches keyboard layout: 1..9 instead of 0..8)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefix Configuration ---
# Dual Prefix: Ctrl+a (primary) and Ctrl+b (secondary)
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# --- Easy Keybindings ---
# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 🌸 Tmux configuration reloaded! "

# Quick Cheat Sheet Popup (Prefix + ? or press F1 anywhere inside tmux)
bind '?' display-popup -E -w 75% -h 75% -b rounded -S "fg=#e6a6c8" -T " 🌸 Tmux Quick Cheat Sheet " "less -R ~/.config/tmux/cheatsheet.txt"
bind -n F1 display-popup -E -w 75% -h 75% -b rounded -S "fg=#e6a6c8" -T " 🌸 Tmux Quick Cheat Sheet " "less -R ~/.config/tmux/cheatsheet.txt"

# Split panes intuitively (inherits current working directory)
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '_' split-window -v -c "#{pane_current_path}"

# Open new window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation with Alt + Arrow keys (No prefix needed!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane navigation with Prefix + Vim keys (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation with Shift + Left/Right (No prefix needed!)
bind -n S-Left previous-window
bind -n S-Right next-window

# Jump directly to windows with Alt + 1..9 (No prefix needed!)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resizing panes easily (Prefix + Shift + Arrow keys)
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5

# --- Copy Mode (Vi Mode) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==============================================================================
#  THEME: Noctalia / Sakura Pink Palette
#  Primary (Sakura): #e6a6c8 | Dark Bg: #10111b | Surface: #1d1a2a
#  Secondary: #afa2d8 | Text: #eee7f0 | Muted: #c8b9ca | Alert: #f08a9b
# ==============================================================================

# Status Bar Base Settings
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=#10111b,fg=#eee7f0"

# Pane Borders
set -g pane-border-style "fg=#4d465c,bg=default"
set -g pane-active-border-style "fg=#e6a6c8,bg=default"
set -g display-panes-color "#afa2d8"
set -g display-panes-active-color "#e6a6c8"

# Command Line & Popup Messages
set -g message-style "bg=#1d1a2a,fg=#e6a6c8,bold"
set -g message-command-style "bg=#1d1a2a,fg=#eee7f0"
set -g mode-style "bg=#3b304e,fg=#e6a6c8,bold"

# Left Status (Session Name & Prefix Indicator)
set -g status-left-length 40
set -g status-left "#[fg=#2b1422,bg=#e6a6c8,bold] 󰍹 #S #[fg=#e6a6c8,bg=#10111b,none]#{?client_prefix,#[fg=#f08a9b,bg=#10111b,bold] 󰌌 PREFIX , }"

# Right Status (Current Working Directory & Clock)
set -g status-right-length 80
set -g status-right "#[fg=#1d1a2a,bg=#10111b]#[fg=#eee7f0,bg=#1d1a2a] 󰋜 #{b:pane_current_path} #[fg=#afa2d8,bg=#1d1a2a]#[fg=#2b1422,bg=#afa2d8,bold] 󰃰 %H:%M #[fg=#afa2d8,bg=#10111b,none]"

# Window List Styling
set -g window-status-separator " "

# Inactive Window Tab
set -g window-status-format "#[fg=#1d1a2a,bg=#10111b]#[fg=#c8b9ca,bg=#1d1a2a]#I: #W#[fg=#1d1a2a,bg=#10111b]"

# Active Window Tab (Glowing Sakura Pink Pill)
set -g window-status-current-format "#[fg=#e6a6c8,bg=#10111b]#[fg=#2b1422,bg=#e6a6c8,bold]#I: #W#{?window_zoomed_flag, 󰁌 ,}#[fg=#e6a6c8,bg=#10111b,none]"
