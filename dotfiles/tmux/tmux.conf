# ==============================================================================
#  TMUX CONFIGURATION
# ==============================================================================

# --- General Settings ---
# Terminal & TrueColor Support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -s escape-time 10
set -g history-limit 10000

# Mouse Support (click windows/panes, drag borders to resize, scroll history)
set -g mouse on

# 1-Based Indexing (matches keyboard layout: 1..9 instead of 0..8)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefix Configuration ---
# Dual Prefix: Ctrl+a (primary) and Ctrl+b (secondary)
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# --- Easy Keybindings ---
# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 󰑓 Tmux configuration reloaded! "

# Quick Cheat Sheet Popup (Prefix + ? or press F1 anywhere inside tmux)
bind '?' display-popup -E -w 75% -h 75% -b rounded -S "fg=blue" -T " 󰋖 Tmux Quick Cheat Sheet " "less -R ~/.config/tmux/cheatsheet.txt"
bind -n F1 display-popup -E -w 75% -h 75% -b rounded -S "fg=blue" -T " 󰋖 Tmux Quick Cheat Sheet " "less -R ~/.config/tmux/cheatsheet.txt"

# Split panes intuitively (inherits current working directory)
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '_' split-window -v -c "#{pane_current_path}"

# Open new window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation with Alt + Arrow keys (No prefix needed!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane navigation with Prefix + Vim keys (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation with Shift + Left/Right (No prefix needed!)
bind -n S-Left previous-window
bind -n S-Right next-window

# Jump directly to windows with Alt + 1..9 (No prefix needed!)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resizing panes easily (Prefix + Shift + Arrow keys)
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5

# --- Copy Mode (Vi Mode) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==============================================================================
#  THEME: minimal text-only bar (tmux-dotbar / minimal-tmux-status style)
#  Transparent bar, ANSI colour names only so it follows the active kitty
#  theme. No background fills anywhere on the bar.
# ==============================================================================

# Status Bar Base Settings
set -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=brightblack"

# Blank second line = breathing room between the bar and the panes
set -g status 2
set -g status-format[1] ""

# Pane Borders (thin, active one tinted, no heavy blocks)
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style "fg=black,bg=default"
set -g pane-active-border-style "fg=blue,bg=default"
set -g display-panes-colour "brightblack"
set -g display-panes-active-colour "blue"

# Popups & Menus (rounded, matches the pills)
set -g popup-border-lines rounded
set -g popup-border-style "fg=blue"
set -g menu-border-lines rounded
set -g menu-border-style "fg=blue"
set -g menu-selected-style "bg=blue,fg=brightwhite"

# Command Line, Messages & Selection
set -g message-style "bg=default,fg=blue,bold"
set -g message-command-style "bg=default,fg=magenta,bold"
set -g mode-style "bg=blue,fg=brightwhite"
set -g copy-mode-match-style "bg=black,fg=brightwhite"
set -g copy-mode-current-match-style "bg=magenta,fg=brightwhite"

# Left: session name as coloured text (yellow while prefix held, red in copy mode)
set -g status-left-length 40
set -g status-left "#[fg=#{?client_prefix,yellow,#{?pane_in_mode,red,blue}},bg=default,bold] #{?client_prefix,󰌌,󰕮} #S "

# Right: dim cwd and clock, thin divider, no fills
set -g status-right-length 80
set -g status-right "#[fg=brightblack,bg=default]󰉋 #{b:pane_current_path} #[fg=black]│#[fg=brightblack] 󰥔 %H:%M "

# Window List (centered; inactive = dim, active = blue dot + bright name)
set -g window-status-separator "  "
set -g window-status-format "#[fg=brightblack,bg=default]○ #I #W#{?window_bell_flag, #[fg=red]󰂞,}"
set -g window-status-current-format "#[fg=blue,bg=default,bold]● #I #[fg=brightwhite]#W#{?window_zoomed_flag,#[fg=magenta] 󰁌,}"
set -g window-status-activity-style "fg=yellow"
setw -g monitor-activity off
