# BACKGROUND
background {
    monitor =
    path = /home/saponela/Pictures/wall/wall1.jpg
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}
animations {
    animation = fadeIn, 0, 0, linear
}

# GENERAL
general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(105, 72, 40, 0)
    inner_color = rgba(231, 127, 127, 0.2)
    font_color = rgb(199, 165, 165)
    font_family = SF Pro Display Display
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = SF Pro Mono Display Bold
  position = 60, -30
  halign = left
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = SF Pro Display Display
  position = 65, -160
  halign = left
  valign = top
}

# WEATHER
label {
    monitor =
    text = cmd[update:3600000] echo "$(/home/saponela/.config/hypr/Hyprlock-Dots/.config/hyprlock/scripts/weather.sh)"
    color = rgba(242, 243, 244, 0.75)
    font_size = 14
    font_family = SF Pro Display
    position = 65, -200
    halign = left
    valign = top
}

# SYSTEM INFO
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(uname -r)</b> | up $(uptime -p | sed 's/up //')"
    color = rgba(242, 243, 244, 0.4)
    font_size = 12
    font_family = SF Pro Display
    position = -60, -30
    halign = right
    valign = top
}

# BATTERY
label {
    monitor =
    text = cmd[update:1000] echo "$(/home/saponela/.config/hypr/Hyprlock-Dots/.config/hyprlock/scripts/battery.sh)"
    color = rgba(242, 243, 244, 0.75)
    font_size = 13
    font_family = SF Pro Display
    position = 80, 60
    halign = left
    valign = bottom
}

# USER IMAGE
image {
    monitor =
    path = /home/saponela/.config/hypr/Hyprlock-Dots/.config/hyprlock/wallpapers/me.jpg
    size = 100
    border_size = 1
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, -40
    halign = center
    valign = center
}

# GREETING
label {
    monitor =
    text = cmd[update:1000] echo "Hello, ${USER^} :)"
    color = rgba(242, 243, 244, 0.75)
    font_size = 18
    font_family = SF Pro Display
    position = 0, -120
    halign = center
    valign = center
}

# MUSIC ALBUM ART
image {
    monitor =
    path = /tmp/hyde-mpris.png
    size = 280
    rounding = 20
    border_size = 0
    reload_time = 1
    reload_cmd = /home/saponela/.config/hypr/Hyprlock-Dots/.config/hyprlock/scripts/hlock_mpris.sh
    position = -60, 130
    halign = right
    valign = bottom
}

# MUSIC INFO
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(/home/saponela/.config/hypr/Hyprlock-Dots/.config/hyprlock/scripts/music.sh --title)</b>"
    color = rgba(255, 255, 255, 0.9)
    font_size = 16
    font_family = SF Pro Display  Bold
    position = -60, 100
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo "$(/home/saponela/.config/hypr/Hyprlock-Dots/.config/hyprlock/scripts/music.sh --artist)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = SF Pro Display 
    position = -60, 70
    halign = right
    valign = bottom
}
