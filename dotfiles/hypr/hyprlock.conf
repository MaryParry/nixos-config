# ==============================================================================
# Hyprlock Configuration - Minimal Retro Gruvbox
# ==============================================================================

# GENERAL
general {
    hide_cursor = false
    ignore_empty_input = true
}

# BACKGROUND (Clean wallpaper with comfortable blur)
background {
    monitor =
    path = /home/saponela/.cache/current_wallpaper.png
    blur_passes = 2
    contrast = 0.95
    brightness = 0.8
    vibrancy = 0.2
    color = rgba(29, 32, 33, 1.0)
}

# MINIMAL RETRO CHASSIS
shape {
    monitor =
    size = 420, 340
    color = rgba(40, 40, 40, 0.90)
    rounding = 0
    border_size = 2
    border_color = rgba(215, 153, 33, 0.75)
    position = 0, 0
    halign = center
    valign = center
}

# CLOCK
label {
    monitor =
    text = $TIME
    color = rgba(235, 219, 178, 1.0)
    font_size = 54
    font_family = IosevkaTerm Nerd Font Heavy
    position = 0, 95
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000:true] date +"%A, %d %B %Y"
    color = rgba(214, 93, 14, 0.95)
    font_size = 12
    font_family = IosevkaTerm Nerd Font Medium
    position = 0, 45
    halign = center
    valign = center
}

# DIVIDER
shape {
    monitor =
    size = 340, 1
    color = rgba(102, 92, 84, 0.5)
    position = 0, 18
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = false
    dots_rounding = 0
    outer_color = rgba(215, 153, 33, 0.7)
    inner_color = rgba(29, 32, 33, 0.95)
    font_color = rgba(235, 219, 178, 1.0)
    font_family = IosevkaTerm Nerd Font
    fade_on_empty = false
    rounding = 0
    placeholder_text = Password: ▋
    hide_input = false
    check_color = rgba(142, 192, 124, 1.0)
    fail_color = rgba(204, 36, 29, 1.0)
    fail_text = 󰅚 ACCESS DENIED ($ATTEMPTS)
    capslock_color = rgba(254, 128, 25, 1.0)
    numlock_color = rgba(142, 192, 124, 1.0)
    bothlock_color = rgba(204, 36, 29, 1.0)
    position = 0, -32
    halign = center
    valign = center
}

# STATUS (Layout & Battery)
label {
    monitor =
    text = cmd[update:2000:true] echo "  $LAYOUT[US,GE,DE]   •   $(/home/saponela/.config/hypr/scripts/battery.sh)"
    color = rgba(168, 153, 132, 0.9)
    font_size = 11
    font_family = IosevkaTerm Nerd Font
    position = 0, -82
    halign = center
    valign = center
}

# MUSIC PLAYING (MPRIS) - only shows when playing
label {
    monitor =
    text = cmd[update:2000:true] /home/saponela/.config/hypr/scripts/music.sh
    color = rgba(211, 134, 155, 0.95)
    font_size = 11
    font_family = IosevkaTerm Nerd Font
    position = 0, -120
    halign = center
    valign = center
}
