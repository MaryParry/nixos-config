# ==============================================================================
# Hyprlock Configuration - Gruvbox Cyber-Deck HUD
# ==============================================================================

# GENERAL
general {
    hide_cursor = false
    ignore_empty_input = true
}

# BACKGROUND (Clean desktop wallpaper)
background {
    monitor =
    path = /home/saponela/Pictures/wall/pics/wallpapers/wallhaven_l315vy.jpg
    blur_passes = 0
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.2
    color = rgba(29, 32, 33, 1.0)
}

# FLOATING CYBER-DECK CARD CONTAINER
shape {
    monitor =
    size = 460, 520
    color = rgba(40, 40, 40, 0.88)
    rounding = 16
    border_size = 2
    border_color = rgba(216, 166, 87, 0.5)
    position = 0, 0
    halign = center
    valign = center
}

# TOP BAR / TERMINAL HEADER
label {
    monitor =
    text = 󰌾  $USER@tetri  •  session locked
    color = rgba(131, 165, 152, 0.95)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 222
    halign = center
    valign = center
}

# TOP DIVIDER
shape {
    monitor =
    size = 390, 1
    color = rgba(146, 131, 116, 0.4)
    position = 0, 198
    halign = center
    valign = center
}

# CLOCK (Native zero-latency 24h time)
label {
    monitor =
    text = $TIME
    color = rgba(235, 219, 178, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 118
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000:true] date +"%A, %d %B %Y"
    color = rgba(216, 166, 87, 0.95)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 52
    halign = center
    valign = center
}

# KEYBOARD LAYOUT INDICATOR
label {
    monitor =
    text =   $LAYOUT[US,GE,DE]
    color = rgba(216, 166, 87, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Medium
    position = -80, 2
    halign = center
    valign = center
}

# BATTERY INDICATOR
label {
    monitor =
    text = cmd[update:2000:true] /home/saponela/.config/hypr/scripts/battery.sh
    color = rgba(231, 138, 78, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Medium
    position = 80, 2
    halign = center
    valign = center
}

# INPUT FIELD (TERMINAL PASSWORD PROMPT)
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.26
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(216, 166, 87, 0.75)
    inner_color = rgba(29, 32, 33, 0.95)
    font_color = rgba(235, 219, 178, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    rounding = 8
    placeholder_text = ❯ Enter password...
    hide_input = false
    check_color = rgba(125, 174, 163, 1.0)
    fail_color = rgba(234, 105, 98, 1.0)
    fail_text = 󰅚 $FAIL ($ATTEMPTS)
    capslock_color = rgba(231, 138, 78, 1.0)
    numlock_color = rgba(142, 192, 124, 1.0)
    bothlock_color = rgba(234, 105, 98, 1.0)
    position = 0, -58
    halign = center
    valign = center
}

# BOTTOM DIVIDER
shape {
    monitor =
    size = 390, 1
    color = rgba(146, 131, 116, 0.4)
    position = 0, -112
    halign = center
    valign = center
}

# SYSTEM INFO & UPTIME
label {
    monitor =
    text = cmd[update:2000:true] /home/saponela/.config/hypr/scripts/sysinfo.sh
    color = rgba(142, 192, 124, 0.9)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -145
    halign = center
    valign = center
}

# MUSIC PLAYING (MPRIS)
label {
    monitor =
    text = cmd[update:2000:true] /home/saponela/.config/hypr/scripts/music.sh
    color = rgba(211, 134, 155, 0.9)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -182
    halign = center
    valign = center
}
