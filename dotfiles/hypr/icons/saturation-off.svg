<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Neutral / desaturated monochrome gradient -->
    <linearGradient id="neutralGrad" x1="5%" y1="5%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="25%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#6B7280" />
      <stop offset="75%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <!-- Glass lighting highlight -->
    <linearGradient id="highlightOff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Crisp rim -->
    <linearGradient id="rimOff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="shadowOff" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <filter id="glyphShadowOff" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base rounded squircle with neutral gradient -->
  <rect x="12" y="12" width="104" height="104" rx="30" fill="url(#neutralGrad)" filter="url(#shadowOff)" />

  <!-- Lighting overlay -->
  <rect x="12" y="12" width="104" height="104" rx="30" fill="url(#highlightOff)" />

  <!-- Crisp border rim -->
  <rect x="13" y="13" width="102" height="102" rx="29" fill="none" stroke="url(#rimOff)" stroke-width="2" />

  <!-- Neutral emblem matching the on-state -->
  <g transform="translate(64, 64)" filter="url(#glyphShadowOff)">
    <path d="M 0 -22 C 1.5 -8 8 -1.5 22 0 C 8 1.5 1.5 8 0 22 C -1.5 8 -8 1.5 -22 0 C -8 -1.5 -1.5 -8 0 -22 Z" fill="#9CA3AF" fill-opacity="0.8" />
    <path d="M 16 -16 C 16.8 -11 20 -8 25 -7 C 20 -6 16.8 -3 16 2 C 15.2 -3 12 -6 7 -7 C 12 -8 15.2 -11 16 -16 Z" fill="#9CA3AF" fill-opacity="0.7" />
    <circle cx="-14" cy="14" r="2.5" fill="#9CA3AF" fill-opacity="0.6" />
  </g>
</svg>
