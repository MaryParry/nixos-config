# Hyprland Config

# MONITORS
monitor=eDP-1, 1920x1080@60, 0x0, 1

# MY PROGRAMS
$terminal = kitty
$fileManager = nautilus
$menu = vicinae toggle

# AUTOSTART

exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = dunst
exec-once = vicinae server
exec-once = noctalia-shell
exec-once = bluetoothctl
exec-once = hypridle
exec-once = bluetoothctl power on

# ENVIRONMENT VARIABLES
# env = XCURSOR_SIZE,24
# env = HYPRCURSOR_SIZE,24

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
# LOOK AND FEEL
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
#    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(b0b0b0b0) rgba(c3dee0c3) 45deg

    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.95
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}


animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
}

# INPUT
input {
    kb_layout = us,ge,de
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
  
    sensitivity = 0.2
    touchpad {
        natural_scroll = true
    }
}

# GESTURES
gestures {
 #gesture = 3, left, dispatcher, workspace, e+1
 #gesture = 3, right, dispatcher, workspace, e-1
 gesture = 3, horizontal, workspace

}

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
# KEYBINDINGS
$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, F, fullscreen, 
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, left
bind = $mainMod, h, movefocus, left
bind = $mainMod, right, movefocus, right
bind = $mainMod, l, movefocus, right
bind = $mainMod, up, movefocus, up
bind = $mainMod, k, movefocus, up
bind = $mainMod, down, movefocus, down
bind = $mainMod, j, movefocus, down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, mouse_left, workspace, e-1
bind = $mainMod, mouse_right, workspace, e+1

# Audio control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#lock on lidclose
bindl=,switch:on:Lid Switch, exec, hyprlock --grace 0 
bind = SUPER, L, exec, hyprlock #testing 

source = /home/saponela/.config/hypr/noctalia/noctalia-colors.conf

#jetbrain xwayland fixes. see https://github.com/hyprwm/Hyprland/issues/4257
windowrule {
  name = windowrule-jb-tag
  tag = +jb
  match:class = ^jetbrains-.*
  match:initial_title = ""
}

windowrule {
  name = windowrule-jb-focus
  focus_on_activate = on
  no_initial_focus = on
  float=off
  match:tag = jb
}
