general {
    lock_cmd = noctalia-shell --lock
    before_sleep_cmd = noctalia-shell --lock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = noctalia-shell --lock
}

listener {
    timeout = 330
    on-timeout = systemctl suspend
}
